  # Stage 3 group 4a: Admin (Users / Announcements / AdminNotes), AuditEvents,
  # Accounts, Sessions, and the app-wide shared partials (_pagination,
  # _diagnosis_modal). Follows the conventions established by groups 1-3b:
  #
  #   - Top-level `admin:` mirrors the `Admin::` controller/view module, with
  #     one sub-key per sub-resource (`users:`, `announcements:`,
  #     `admin_notes:`) matching each view's own virtual path
  #     (`admin/users/index` -> `admin.users.index`), so lazy `t(".key")`
  #     resolves the same way it does for every other group's views.
  #     `admin.kicker` ("Administration") is the one string shared *across*
  #     those three sub-resources' index pages -- kept as a direct child of
  #     `admin:` rather than duplicated three times, since (unlike `common:`)
  #     it is specific to this module's own page headers.
  #   - Attribute labels that match `User`/`Announcement`
  #     `human_attribute_name` verbatim (Name, Email, Role, Title, Published)
  #     call that directly instead of adding a redundant key, same rule
  #     earlier groups used. Ones that don't match (e.g. the "Status" column
  #     header, which isn't itself an attribute name) get their own key.
  #   - `sessions.new.title` doubles as the h1 heading, the browser tab
  #     title, and (via `sessions.new.submit_button`, kept as a *separate*
  #     key despite the identical English text) is available if the submit
  #     label and page title ever need to diverge later.
  #   - Login form's login_id/password labels reuse `User.human_attribute_name`
  #     directly: `form_with scope: :session` isn't backed by a real model,
  #     so Rails' automatic label translation has no `User` attribute
  #     metadata to draw on and would otherwise stay stuck on the raw
  #     humanized attribute name in every locale. Since the fields really are
  #     a User's login_id/password, reusing that model's own translations
  #     (login_id's label itself switches on config.x.account_identifier --
  #     see User.human_attribute_name) avoids a duplicate pair of keys with
  #     the identical text.
  #   - `shared.pagination.*` and `shared.diagnosis_modal.*` are keyed off
  #     their partials' own virtual paths (`shared/_pagination.html.erb`,
  #     `shared/_diagnosis_modal.html.erb`), same as any other partial.
  #     `_diagnosis_modal.html.erb`'s static title/description (shown before
  #     the turbo-frame it wraps replaces them with the real
  #     `diagnoses/new.html.erb` content) reuse `diagnoses.new.title` /
  #     `diagnoses.new.modal_description` and `common.close` rather than
  #     duplicating that group 1 text -- it is genuinely the same modal, just
  #     its pre-turbo-frame-load fallback markup.
