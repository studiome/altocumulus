      title: "Elective Slot Rules"
      description: "One rule per weekday. Configure how many elective surgery slots repeat each week."
      day_header: "Day"
      slots_header: "Slots"
      slot_duration_header: "Slot Duration"
      not_configured: "Not configured"
      add_link: "Add"
    show:
      title: "Elective Slot Rule Details"
      subtitle: "Slot Master"
      badge: "Slot Rule"
      slot_duration_label: "Slot Duration"
      total_capacity_label: "Total Capacity"
      fractional_helper: "A fractional value means the last of %{total} slots is shortened."
