      slot_count_placeholder: "e.g. 2.5"
      slot_duration_label: "Slot Duration (minutes)"
      slot_duration_placeholder: "e.g. 240"
      slot_duration_helper: "The total time available in one slot. A surgery that runs longer is treated as extending its own slot, not consuming another."
    # Shared between the form label and the show page (see design note
    # above `common:`) -- "Number of Slots" is identical in both places.
    labels:
      slot_count: "Number of Slots"
    # Unit abbreviations appended to raw numbers on index/show.
    units:
      minutes: "min"
      hours: "h"
