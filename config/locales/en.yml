  # Stage 3 group 3a (Hospitalizations). Follows the conventions established
  # by groups 1/2 above. This is the app's most complex screen group (a
  # 3-section form, a nested diagnosis-row sub-form, an inline update-history
  # table, and a deleted list), so a few extra notes:
  #
  #   - `labels:` here holds every attribute-derived label whose text is
  #     reused across more than one action (index/show/deleted/form) but
  #     does not match `Hospitalization.human_attribute_name` verbatim (e.g.
  #     "Reservation Status" vs the default humanize "Reservation status").
  #     Where a label's text is reused but IS an exact match to
  #     human_attribute_name (Purpose, Ward, Outcome, Reason, Patient), the
  #     view calls `Hospitalization.human_attribute_name` directly instead of
  #     adding a redundant key here -- same rule groups 1/2 used.
  #   - A label used in only one action (e.g. show's own "Planned Length of
  #     Stay", the form's "Planned Length of Stay (Days)", index's plain
  #     "Planned Days" column) is intentionally 3 separate keys, one per
  #     action's own scope, rather than a shared `labels:` key -- the English
  #     text genuinely differs between the three screens.
  #   - `hospitalization_diagnosis_fields:` covers the nested diagnosis-row
  #     partial (`_hospitalization_diagnosis_fields.html.erb`), which is
  #     rendered twice from `_form.html.erb` (the persisted-rows loop and the
  #     `<template>` used to clone new rows) but keeps its own scope the same
  #     way `_form.html.erb` keeps `form:` -- Rails' lazy lookup keys off the
  #     partial's own virtual path.
  #   - The show page's own inline change-history table ("Field"/"Before"/
  #     "After" headers, "Update History" divider) is a separate, pre-existing
  #     copy of markup that also appears in `audit_events/show.html.erb`
  #     (a different group's file) -- kept as hospitalizations-show-scoped
  #     keys rather than shared ones, since this group cannot touch that
  #     other file. `AuditEventsHelper` itself (the label/before/after *cell
