# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  # These date/time keys mirror Rails' own built-in English defaults, spelled
  # out explicitly so this file has the same structure as ja.yml. No view in
  # the app calls `l()`/`I18n.l` yet (they format dates with `strftime`
  # directly), so this is groundwork for a later stage rather than something
  # that changes current rendering.
  date:
    formats:
      default: "%Y-%m-%d"
      short: "%b %d"
      long: "%B %d, %Y"
      # Stage 3 addition: a single date with its weekday spelled out, for
      # detail-page headers (e.g. Holiday#show). Kept as its own key rather
      # than folding into `long` so `long`'s existing output (no weekday)
      # doesn't change for anything already using it.
      long_with_weekday: "%B %d, %Y (%A)"
      # Stage 3 group 3b (Surgery Schedule board): the weekday name on its
      # own, for the week board's per-day column header, which used to
      # hard-code `date.strftime("%A")`.
      weekday: "%A"
    day_names:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
    abbr_day_names:
      - Sun
      - Mon
      - Tue
      - Wed
      - Thu
      - Fri
      - Sat
    month_names:
      - ~
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
    abbr_month_names:
      - ~
      - Jan
      - Feb
      - Mar
      - Apr
      - May
      - Jun
      - Jul
      - Aug
      - Sep
      - Oct
      - Nov
      - Dec
    order:
      - :year
      - :month
      - :day

  time:
    formats:
      default: "%a, %d %b %Y %H:%M:%S %z"
      short: "%d %b %H:%M"
      long: "%B %d, %Y %H:%M"
      # Stage 3 group 3a (Hospitalizations) additions: a full timestamp (used
      # for the show page's own update-history rows) and a shorter one with
      # no seconds (used for the deleted list's "Deleted At" column) -- both
      # replace a raw `strftime` call that used to hard-code this pattern.
      timestamp: "%Y-%m-%d %H:%M:%S"
      short_timestamp: "%Y-%m-%d %H:%M"
    am: "am"
    pm: "pm"

  nav:
    app_name: "Altocumulus"
    open_menu: "Open menu"
    calendar: "Calendar"
    patients: "Patients"
    surgeries: "Surgeries"
    hospitalizations: "Hospitalizations"
    search: "Search"
    reports: "Reports"
    dashboard: "Dashboard"
    schedule: "Schedule"
    audit_log: "Audit Log"
    masters: "Masters"
    diagnoses: "Diagnoses"
    procedures: "Procedures"
    slot_rules: "Slot Rules"
    holidays: "Holidays"
    admin: "Admin"
    users: "Users"
    announcements: "Announcements"
    admin_notes: "Admin Notes"
    account: "Account"
    sign_out: "Sign Out"

  locale:
    switch_label: "Language"
    en: "English"
    ja: "日本語"

  # Standard ActiveModel/ActiveRecord validation messages, spelled out so
  # ja.yml has the same structure. These match Rails' own built-in English
  # defaults byte-for-byte, so defining them here does not change anything
  # that already renders in English -- it is what lets ja.yml override them
  # for the Japanese locale.
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: "must be accepted"
      blank: "can't be blank"
      confirmation: "doesn't match %{attribute}"
      empty: "can't be empty"
      equal_to: "must be equal to %{count}"
      even: "must be even"
      exclusion: "is reserved"
      greater_than: "must be greater than %{count}"
      greater_than_or_equal_to: "must be greater than or equal to %{count}"
      inclusion: "is not included in the list"
      invalid: "is invalid"
      less_than: "must be less than %{count}"
      less_than_or_equal_to: "must be less than or equal to %{count}"
      not_a_number: "is not a number"
      not_an_integer: "must be an integer"
      odd: "must be odd"
      other_than: "must be other than %{count}"
      present: "must be blank"
      required: "must exist"
      too_long: "is too long (maximum is %{count} characters)"
      too_short: "is too short (minimum is %{count} characters)"
      wrong_length: "is the wrong length (should be %{count} characters)"

  # activerecord.models / activerecord.attributes are intentionally NOT
  # overridden for English: Rails' own automatic humanize (e.g.
  # "date_of_birth" -> "Date of birth") is already what every existing view
  # and test renders/asserts today, and it is used directly by
  # AuditEventsHelper (human_attribute_name / model_name.human) for the
  # audit-log diff table. Explicitly redefining these in English risks
  # silently drifting from Rails' own capitalization rules in ways nothing
  # here would catch (it already broke one audit-log test with "Date of
  # Birth" vs the expected "Date of birth" -- reverted). ja.yml defines the
  # full set for Japanese; English keeps relying on the humanize default.
  activerecord:
    errors:
      format: "%{attribute} %{message}"
      messages:
        taken: "has already been taken"
        record_invalid: "Validation failed: %{errors}"
        restrict_dependent_destroy:
          has_one: "Cannot delete record because a dependent %{record} exists"
          has_many: "Cannot delete record because dependent %{record} exist"
        incorrect: "is incorrect"
        not_a_valid_date: "is not a valid date"
        requires_discharge_date: "can only be set together with a discharge date"
        must_include_linked_surgeries_within_period: "must include all linked surgeries within the hospitalization period"
        overlaps_another_hospitalization: "overlaps another hospitalization for this patient"

      models:
        holiday:
          attributes:
            base:
              must_have_name_or_note: "must have a name or a note"
        user:
          attributes:
            base:
              cannot_remove_last_admin: "Cannot remove the last active admin"
        hospitalization:
          attributes:
            hospitalization_diagnoses:
              must_include_at_least_one_diagnosis: "must include at least one diagnosis"
              no_duplicate_diagnoses: "must not include duplicate diagnoses"
              cannot_swap_diagnoses_between_rows: "cannot swap diagnoses between existing rows in one save; change one row to a different diagnosis first"
            discharge_date:
              must_be_on_or_after_admission_date: "must be on or after the admission date"
            admission_date:
              or_scheduled_admission_date_required: "or a scheduled admission date must be present"
            patient_id:
              must_match_patient_of_linked_surgeries: "must match the patient of every linked surgery"
        surgery:
          attributes:
            patient_diagnoses:
              must_all_belong_to_selected_patient: "must all belong to the selected patient"
            surgery_procedure_selections:
              must_include_at_least_one_procedure: "must include at least one procedure"
              too_many_procedure_selections: "must be five or fewer"
              no_duplicate_procedure_selections: "must not include duplicate procedures"
              cannot_swap_procedures_between_rows: "cannot swap procedures between existing rows in one save; change one row to a different procedure first"
            hospitalization:
              must_belong_to_same_patient_as_surgery: "must belong to the same patient as the surgery"
            surgery_date:
              must_fall_within_hospitalization_period: "must fall within the linked hospitalization period"
              must_be_blank_when_undecided: "must be left blank when marked as undecided"
              must_be_entered_or_undecided: "must be entered, or choose Undecided"
            surgery_date_status:
              not_valid: "is not valid"

  # Stage 2 of the i18n rollout: display strings built by models and helpers
  # (option-constant labels, derived status text, warning/summary messages).
  # DB columns keep their English keys forever -- only these looked-up labels
  # are localized. English values here must stay byte-identical to what the
  # constants/strings used to hard-code, since existing tests assert them.
  models:
    hospitalization:
      outcome_options:
        recovered: "Recovered"
        improved: "Improved"
        unchanged: "Unchanged"
        worsened: "Worsened"
        transferred: "Transferred"
        died: "Died"
      discharge_destination_options:
        home: "Home"
        hospital: "Another Hospital"
        facility: "Nursing Facility"
        death: "Death"
        other: "Other"
      reservation_status_options:
        requested: "Requested"
        waiting: "Waiting for Admission"
        date_fixed: "Admission Date Fixed"
        surgery_date_fixed: "Surgery Date Fixed"
        admitted: "Admitted"
        admitted_other_dept: "Admitted (Other Dept.)"
        on_hold: "On Hold"
        discharged: "Discharged"
      purpose_options:
        surgery: "Surgery"
        examination: "Examination / Procedure"
        chemotherapy: "Chemotherapy"
      admin_status_options:
        unconfirmed: "Unconfirmed"
        confirmed: "Confirmed"
      status_filter_options:
        in_hospital: "In Hospital"
        discharged: "Discharged"
        upcoming: "Upcoming"
        waiting: "Waiting"
        unconfirmed: "Unconfirmed"
        recently_updated: "Recently Updated"
        referred: "Referred"
      status_label:
        discharged: "Discharged"
        in_hospital: "In Hospital"
        scheduled: "Scheduled"
      to_s:
        date_not_set: "date not set"
        in_hospital: "in hospital"
    surgery:
      scheduling_type_options:
        elective: "Elective"
        emergency: "Emergency"
      surgery_date_status_options:
        scheduled: "Date Specified"
        undecided: "Undecided"
      surgery_date_display_undated: "Undated"
      to_s_date_not_set: "Date not set"
    patient:
      sex_options:
        male: "Male"
        female: "Female"
        other: "Other"
    lateralizable:
      laterality_options:
        right: "Right"
        left: "Left"
        bilateral: "Bilateral"
        none: "None"
    elective_slot_rule:
      to_s: "%{day} - %{count} slots x %{minutes} min"
    elective_slot_usage:
      warnings:
        holiday: "%{holiday_name} is a holiday: no elective slots are available."
        not_configured: "No elective slots are configured for %{day}."
        unscheduled:
          one: "1 elective surgery is not assigned to an available slot."
          other: "%{count} elective surgeries are not assigned to an available slot."
        overrun:
          single: "Slot %{number} is booked %{overrun} min past its %{limit} min limit."
          same_limit: "Slots %{numbers} are booked past their %{limit} min limit."
          item: "Slot %{number} is booked past its %{limit} min limit."
    user:
      role_options:
        user: "User"
        admin: "Admin"
    audit_event:
      # AUDITABLE_TYPES itself (Patient/Surgery/Hospitalization) is not
      # listed here -- it reuses activerecord.models.* via
      # `AuditEvent.auditable_type_options` (see app/models/audit_event.rb),
      # which for English is just Rails' own humanize default and already
      # matches the raw value this used to render directly.
      action_options:
        create: "Create"
        update: "Update"
        destroy: "Delete"

  # `helpers.submit` is deliberately NOT defined here -- Rails' own English
  # default template for a bare `form.submit` ("Create %{model}" /
  # "Update %{model}") already matches this app's English rendering
  # byte-for-byte, so redefining it risks silently drifting from Rails' own
  # wording in a way nothing here would catch. ja.yml defines it explicitly
  # instead, since Japanese has no such built-in default and was rendering
  # as a mix of the two languages (e.g. "Create 患者") without it.
  helpers:
    hospitalizations:
      length_of_stay:
        days:
          one: "%{count} day"
          other: "%{count} days"
        ongoing: "Day %{count} (ongoing)"
        unknown: "-"
    audit_events:
      "yes": "Yes"
      "no": "No"
      not_found: "(not found)"

  # Stage 3 of the i18n rollout: view text. Group 1 (Diagnoses /
  # SurgeryProcedures / Holidays / ElectiveSlotRules master-data screens)
  # establishes the conventions later groups follow:
  #
  #   - View-local strings use Rails' lazy `t(".key")` lookup, scoped to the
  #     view's own namespace below (e.g. `diagnoses.index.title`). A
  #     .turbo_stream.erb sibling of a .html.erb action (e.g.
  #     diagnoses/new.turbo_stream.erb next to diagnoses/new.html.erb)
  #     shares that action's scope automatically -- lazy lookup keys off the
  #     virtual path, not the format -- so one set of keys covers both.
  #   - Controller flash messages also resolve lazily (`t(".notice")` in
  #     DiagnosesController#create resolves under `diagnoses.create`), which
  #     is deliberately the same scope a create.turbo_stream.erb view uses,
  #     letting a flash notice and an inline turbo-stream success message
  #     share one `success_notice` key instead of duplicating the string.
  #   - `common:` (below) holds short action words/labels reused across
  #     several screens (Edit/Delete/View/Actions/etc). Prefer it over a
  #     fresh per-view key when the English text would be identical.
  #   - A string reused across this group's own screens but too specific
  #     for `common:` (e.g. the "Closed"/"Note only" holiday badges, shown
  #     on both holidays#index and holidays#show) lives under a shared
  #     sub-key of that resource's own namespace (e.g.
  #     `holidays.status_badge.closed`) and is referenced with the full
  #     path `t("holidays.status_badge.closed")` rather than lazily, since
  #     it's shared across more than one action's scope.
  #   - Where a label is already covered by `activerecord.attributes` (e.g.
  #     a "Name"/"Date"/"Note" table header that matches the model's own
  #     attribute name verbatim), reuse `Model.human_attribute_name(:attr)`
  #     instead of adding a redundant translation key -- it already
  #     localizes per stage 1/2 and stays in sync with the form labels.
  #   - Dates use `l(date, format: :default)` (compact, e.g. "2026-03-10")
  #     or `l(date, format: :long_with_weekday)` (a single date spelled out
  #     with its weekday, e.g. a detail-page header) instead of `strftime`.
  #     Add new `date.formats` keys following that naming pattern rather
  #     than hard-coding a new strftime string in a view.
  common:
    actions: "Actions"
    view: "View"
    edit: "Edit"
    delete: "Delete"
    save: "Save"
    cancel: "Cancel"
    back: "Back"
    new: "New"
    search: "Search"
    clear: "Clear"
    close: "Close"
    show_detail: "Show Detail"
    master_data: "Master Data"
    master_record: "Master Record"
    information: "Information"
    confirm_delete: "Are you sure?"
    none: "-"
    # Stage 3 group 4a additions: require_login / require_admin live in
    # ApplicationController and run as a before_action shared by every
    # controller, so they cannot use lazy `t(".key")` lookup (the resolved
    # scope would vary with whichever controller/action happened to trigger
    # the redirect) -- fixed keys here instead.
    please_sign_in: "Please sign in to continue."
    not_authorized: "You are not authorized to perform this action."
    # The Field/Before/After update-history table headers used to be
    # duplicated as hospitalizations.show-scoped keys (group 3a couldn't
    # touch audit_events/show.html.erb, which renders the identical table
    # structure) -- group 4a, which owns that file, consolidated both call
    # sites onto these shared keys instead. See hospitalizations/show.html.erb
    # and audit_events/show.html.erb.
    field_header: "Field"
    before_header: "Before"
    after_header: "After"

