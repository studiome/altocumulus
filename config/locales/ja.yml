      holiday: "休日"
      hospitalization: "入院"
      hospitalization_diagnosis: "入院診断"
      patient: "患者"
      patient_diagnosis: "患者診断"
      surgery: "手術"
      surgery_diagnosis_link: "手術診断リンク"
