        holiday:
          attributes:
            base:
              must_have_name_or_note: "名称または備考を入力してください"
        user:
          attributes:
            base:
              cannot_remove_last_admin: "最後の管理者を削除・降格・無効化することはできません"
        hospitalization:
          attributes:
            hospitalization_diagnoses:
              must_include_at_least_one_diagnosis: "を1件以上入力してください"
              no_duplicate_diagnoses: "に重複を含めることはできません"
              cannot_swap_diagnoses_between_rows: "は既存の行同士で診断名を入れ替えることができません。まず一方の行を別の診断名に変更してください"
            discharge_date:
              must_be_on_or_after_admission_date: "は入院日以降の日付にしてください"
            admission_date:
              or_scheduled_admission_date_required: "または入院予定日のいずれかを入力してください"
            patient_id:
              must_match_patient_of_linked_surgeries: "は紐づくすべての手術の患者と一致させてください"
        surgery:
          attributes:
            patient_diagnoses:
              must_all_belong_to_selected_patient: "はすべて選択した患者のものにしてください"
            surgery_procedure_selections:
              must_include_at_least_one_procedure: "を1件以上入力してください"
              too_many_procedure_selections: "は5件以下にしてください"
              no_duplicate_procedure_selections: "に重複を含めることはできません"
              cannot_swap_procedures_between_rows: "は既存の行同士で術式を入れ替えることができません。まず一方の行を別の術式に変更してください"
            hospitalization:
              must_belong_to_same_patient_as_surgery: "は手術と同じ患者のものにしてください"
            surgery_date:
              must_fall_within_hospitalization_period: "は紐づく入院期間内の日付にしてください"
              must_be_blank_when_undecided: "は「未定」を選択している場合は空欄にしてください"
              must_be_entered_or_undecided: "を入力するか「未定」を選択してください"
            surgery_date_status:
              not_valid: "は正しくありません"
