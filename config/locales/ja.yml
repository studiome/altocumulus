    masters: "マスタ"
    diagnoses: "診断名"
    procedures: "術式"
    slot_rules: "手術枠ルール"
    holidays: "休日"
    admin: "管理"
    users: "利用者"
    announcements: "お知らせ"
    admin_notes: "管理者メモ"
    account: "アカウント"
    sign_out: "サインアウト"

  locale:
    switch_label: "言語"
    en: "English"
    ja: "日本語"

  # Standard ActiveModel/ActiveRecord validation messages (mirrors en.yml's
  # errors: block structure). This app doesn't bundle the rails-i18n gem, so
  # these are hand-written to match the wording of `validates` calls actually
  # used across app/models (presence, uniqueness, inclusion, numericality,
  # length, confirmation).
  errors:
    format: "%{attribute}%{message}"
    messages:
      accepted: "を受諾してください"
      blank: "を入力してください"
      confirmation: "が%{attribute}と一致しません"
      empty: "を入力してください"
      equal_to: "は%{count}にしてください"
      even: "は偶数にしてください"
      exclusion: "は予約されています"
      greater_than: "は%{count}より大きい値にしてください"
      greater_than_or_equal_to: "は%{count}以上の値にしてください"
      inclusion: "は一覧にありません"
      invalid: "は不正な値です"
      less_than: "は%{count}より小さい値にしてください"
      less_than_or_equal_to: "は%{count}以下の値にしてください"
      not_a_number: "は数値で入力してください"
      not_an_integer: "は整数で入力してください"
      odd: "は奇数にしてください"
      other_than: "は%{count}以外の値にしてください"
      present: "は入力しないでください"
      required: "を入力してください"
      too_long: "は%{count}文字以内で入力してください"
      too_short: "は%{count}文字以上で入力してください"
      wrong_length: "は%{count}文字で入力してください"

  activerecord:
