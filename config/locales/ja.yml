    pm: "午後"

  nav:
    app_name: "Altocumulus"
    open_menu: "メニューを開く"
    calendar: "カレンダー"
    patients: "患者"
    surgeries: "手術"
    hospitalizations: "入院"
    search: "検索"
    reports: "レポート"
    dashboard: "ダッシュボード"
