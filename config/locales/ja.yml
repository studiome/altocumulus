  # Standard ActiveModel/ActiveRecord validation messages (mirrors en.yml's
  # errors: block structure). This app doesn't bundle the rails-i18n gem, so
  # these are hand-written to match the wording of `validates` calls actually
  # used across app/models (presence, uniqueness, inclusion, numericality,
  # length, confirmation).
  errors:
    format: "%{attribute}%{message}"
    messages:
      accepted: "を受諾してください"
      blank: "を入力してください"
      confirmation: "が%{attribute}と一致しません"
      empty: "を入力してください"
      equal_to: "は%{count}にしてください"
      even: "は偶数にしてください"
      exclusion: "は予約されています"
      greater_than: "は%{count}より大きい値にしてください"
      greater_than_or_equal_to: "は%{count}以上の値にしてください"
      inclusion: "は一覧にありません"
      invalid: "は不正な値です"
      less_than: "は%{count}より小さい値にしてください"
      less_than_or_equal_to: "は%{count}以下の値にしてください"
      not_a_number: "は数値で入力してください"
      not_an_integer: "は整数で入力してください"
      odd: "は奇数にしてください"
      other_than: "は%{count}以外の値にしてください"
      present: "は入力しないでください"
      required: "を入力してください"
      too_long: "は%{count}文字以内で入力してください"
      too_short: "は%{count}文字以上で入力してください"
      wrong_length: "は%{count}文字で入力してください"

  # `Array#to_sentence` (used by several controllers on
  # `errors.full_messages.to_sentence` for a destroy/copy failure alert) asks
  # I18n for these three connector keys before falling back to its own
  # English defaults (", " / " and " / ", and "). Without a ja override here,
  # a multi-error Japanese flash was joined with those English connectors
  # even though every other word in the sentence was Japanese. Not defined in
  # en.yml since English already gets exactly this text from to_sentence's
  # own built-in defaults.
  support:
    array:
      words_connector: "、"
      two_words_connector: "と"
      last_word_connector: "、"

