# Site configuration: what differs between installations (hospitals) but is
# not a runtime admin setting. This committed file is the neutral default and
# keeps the application's stock behavior. To customize a deployment, do NOT
# edit this file: mount your own file on the server and point SITE_CONFIG_PATH
# at it (see config/site.example.yml and config/deploy.yml). The file is read
# once at boot; a malformed file, an unknown key or an unknown field name makes
# the boot fail.
#
# Unknown keys are rejected, so every key below is documented here.

# features: optional features to switch on (everything is off by default,
# which keeps the application's stock behavior).
#   teams: care teams (担当チーム). When true, the Teams master (with each team's
#          rotating terms and members) appears under Masters, hospitalization
#          and surgery forms get a team select, and their show pages display the
#          team and the members of the term covering the case's date. When
#          false the screens, selects and displays are hidden (data is kept) and
#          team_id cannot be listed under required_fields.
features:
  teams: false

# required_fields: fields that must be filled in before a record can be saved,
# in addition to what the app always requires. Keys are model names
# (hospitalization, surgery); values are lists of attribute names. The form's
# red asterisk follows this list automatically.
#   hospitalization: e.g. referred_from, reservation_doctor_id, attending_doctor
#   surgery:         e.g. operator_name, assistant_name, duration_hours
# team_id may be listed for either model (and by purpose) only when
# features.teams is true; otherwise the boot fails.
# hospitalization_by_purpose requires fields only for hospitalizations of a
# given purpose (surgery, examination, chemotherapy, chemoradiotherapy, other),
# on top of the unconditional list. The asterisk follows the purpose chosen in
# the form.
#   hospitalization_by_purpose:
#     examination: [scheduled_procedure_date, procedure_name]
required_fields: {}

# patient: patient ID rules.
#   hospital_id_format:      Ruby regular expression (single-quoted YAML string)
#                            that Patient#hospital_id must match. Omit for no
#                            restriction. Checked when the ID is set or changed.
#   hospital_id_format_hint: human-readable description of the format, shown in
#                            the error message (e.g. "8 digits"). Optional.
patient: {}

# masters: names to make sure exist in the admin-editable master tables, which
# are managed on the Masters screens (Departments, Surgery Locations, Surgical
# Devices) and feed the surgery form's choices. Nothing is created at boot:
# run `bin/rails site:seed_masters` (also part of `db:seed`) after a deploy.
# It only adds missing names, in the order listed, and never renames, reorders
# or deletes existing rows.
#   departments:       clinical departments (診療科)
#   surgery_locations: places a surgery is performed (実施場所). An entry is
#                      a name, or {name: ..., asks_performing_department: true}
#                      to flag a place whose cases may be performed by another
#                      department (applied only to newly created rows).
#   surgical_devices:  surgical support devices (手術支援機器)
#   teams:             care teams (担当チーム). An entry is a name, or
#                      {name: ..., color: blue} with one of blue, red, green,
#                      orange, purple, teal, gray (applied only to newly
#                      created rows; default gray). Seeding teams does not
#                      need features.teams, but they only show when it is true.
#                      Terms and members are entered on the Teams screen.
masters: {}
