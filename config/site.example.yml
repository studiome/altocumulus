# Example site configuration with every key filled in. Copy it to the server,
# edit it, and point SITE_CONFIG_PATH at it (see config/deploy.yml). Names and
# values below are generic placeholders. See config/site.yml for what each key
# means.

features:
  teams: true

required_fields:
  hospitalization:
    - referred_from
    - team_id
    - reservation_doctor_id
    - attending_doctor
  hospitalization_by_purpose:
    examination:
      - scheduled_procedure_date
      - procedure_name
  surgery:
    - operator_name
    - duration_hours

patient:
  hospital_id_format: '\A\d{8}\z'
  hospital_id_format_hint: "8 digits"

masters:
  departments: [消化器内科, 泌尿器科, 産婦人科, 放射線科]
  surgery_locations:
    - 手術室
    - ハイブリッド室
    - name: カテ室
      asks_performing_department: true
    - 病棟処置室
  surgical_devices: [da Vinci, hinotori]
  teams:
    - name: 青チーム
      color: blue
    - name: 赤チーム
      color: red
    - 緑チーム

# Column layout of the ledger tables (see config/site.yml for every column).
ledger_columns:
  operations_calendar: [admission_dates, patient, age_sex, diagnosis_procedure, duration_anesthesia, team, category, reservation, referral_adl, status]
  weekly_pdf: [time_slot, patient, age_sex, diagnosis_procedure, duration_anesthesia, team, category, referral_adl]
  examination_calendar: [admission_dates, patient, age_sex, diagnosis_procedure_name, purpose, team, reservation, referral_adl, status]

# The weekly surgery schedule PDF (see config/site.yml): starting font size
# (6-10) and a title replacing the translated default.
weekly_pdf:
  font_size: 8
  title: "Weekly Operating Room Schedule"

# CSV exports (see config/site.yml for every field): a surgery export shaped
# like a surgical registry (NCD) worksheet, plus a slim admission list. The
# columns are generic placeholders, not any registry's real item codes; the
# clerk maps them to the registry's own layout.
exports:
  ncd_list:
    label: NCD登録用
    subject: surgery
    fields:
      - surgery_date
      - hospital_id
      - patient_name
      - patient_kana
      - age
      - sex
      - scheduling_type
      - diagnoses
      - procedures
      - surgical_device
      - anesthesia_method
      - duration_hours
      - operator
      - assistant
      - admission_date
      - discharge_date
      - emergency_admission
  surgery_list:
    subject: surgery
    fields: [surgery_date, weekday, start_time, slot_category, hospital_id, patient_name, diagnoses, procedures, operator, team, location]
  admission_list:
    subject: hospitalization
    fields: [scheduled_admission_date, admission_date, hospital_id, patient_name, age, sex, diagnoses, purpose, referred_from, adl, reservation_doctor, team, reservation_status]
