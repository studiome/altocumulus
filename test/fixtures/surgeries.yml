one:
  patient: one
  surgery_date: 2026-03-01
  anesthesia_method: "General"
  duration_hours: 1.5

two:
  patient: two
  surgery_date: 2026-03-02
  anesthesia_method: "Spinal"
  duration_hours: 1.0

# 2026-03-03 is a Tuesday, configured with 3 elective slots x 240 min
# (see elective_slot_rules.yml). A slot holds a whole day of one operating
# room, so several surgeries share it:
#   slot 1 -> three + four = 120 min, well inside the 240 min slot
#   slot 2 -> five alone   = 300 min, 60 min past the 240 min slot
#   slot 3 -> empty
#   six    -> no slot assigned yet, so it is unscheduled
three:
  patient: one
  surgery_date: 2026-03-03
  scheduling_type: elective
  slot_number: 1
  start_time: "09:00"
  anesthesia_method: "General"
  duration_hours: 1.0

four:
  patient: two
  surgery_date: 2026-03-03
  scheduling_type: elective
  slot_number: 1
  start_time: "11:00"
  anesthesia_method: "General"
  duration_hours: 1.0

five:
  patient: one
  surgery_date: 2026-03-03
  scheduling_type: elective
  slot_number: 2
  start_time: "09:00"
  anesthesia_method: "General"
  duration_hours: 5.0

six:
  patient: two
  surgery_date: 2026-03-03
  scheduling_type: elective
  anesthesia_method: "General"
  duration_hours: 1.0

# Sunday 2026-03-01 has no elective slot rule configured. Emergency
# surgeries must be unaffected by that: no slot count, no slot time,
# even at night. They never carry a slot number.
emergency_one:
  patient: one
  surgery_date: 2026-03-01
  scheduling_type: emergency
  start_time: "23:30"
  anesthesia_method: "General"
  duration_hours: 2.0
